<dialog class="dlg type-dialog" id="aiTypeDialog" aria-labelledby="aiTypeDialogTitle">
  <div class="dlg__head type-dialog__head">
    <div class="type__icon" data-type-icon aria-hidden="true"></div>
    <div class="type-dialog__identity">
      <div class="kicker">Types of AI systems</div>
      <h2 id="aiTypeDialogTitle" data-dlg-title tabindex="-1">AI system type</h2>
    </div>
    <button type="button" class="dlg__close" data-close aria-label="Close type details"><span aria-hidden="true">✕</span></button>
  </div>
  <div class="dlg__body type-dialog__body"></div>
  <div class="dlg__foot type-dialog__foot"></div>
</dialog>
