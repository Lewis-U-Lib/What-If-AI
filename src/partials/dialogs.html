<dialog class="dlg" id="actDialog" aria-labelledby="actDialogTitle">
  <div class="dlg__head">
    <div>
      <div class="kicker" data-dlg-kicker></div>
      <h2 id="actDialogTitle" data-dlg-title>Use-case idea</h2>
    </div>
    <button type="button" class="dlg__close" data-close aria-label="Close use-case idea details"><span aria-hidden="true">✕</span></button>
  </div>
  <div class="dlg__body"></div>
  <div class="dlg__foot"></div>
</dialog>

<dialog class="dlg drawer" id="savedDrawer" aria-labelledby="savedTitle">
  <div class="dlg__head">
    <div>
      <div class="kicker">Your selection</div>
      <h2 id="savedTitle" data-dlg-title>Saved use-case ideas</h2>
    </div>
    <button type="button" class="dlg__close" data-close aria-label="Close saved use-case ideas"><span aria-hidden="true">✕</span></button>
  </div>
  <div class="dlg__body" id="savedBody"></div>
  <div class="dlg__foot" id="savedFoot" hidden>
    <button type="button" class="btn btn--sm btn--primary" id="printSaved">Print or save as PDF</button>
    <button type="button" class="btn btn--sm" id="clearSaved">Clear all</button>
  </div>
</dialog>

<aside class="note saved-storage-note" data-storage-warning hidden aria-label="Saved selection storage">
  Saved selections are temporary in this tab because browser storage is unavailable. Changes may be lost when you reload or open the other tool; earlier saved selections may return.
  <button type="button" class="btn btn--sm" data-open-saved>Print or save as PDF now</button>
</aside>
<div id="printRoot" aria-hidden="true"></div>
<div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
