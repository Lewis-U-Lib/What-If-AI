<!-- ══ floating help menu ══ -->
<div class="fab-scrim" id="fabScrim"></div>
<div class="fab-wrap" id="fabWrap">
  <div class="fab-menu">
    <button class="fab-item" id="fabAskUs" type="button" aria-label="Ask Us — Lewis University Library Chat">
      <span class="fab-item__icon"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-chat"/></svg></span> Ask Us
    </button>
    <a class="fab-item" href="https://lewisu.libcal.com/appointments/" target="_blank" rel="noopener noreferrer">
      <span class="fab-item__icon"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-calendar"/></svg></span> Make an Appointment
    </a>
    <a class="fab-item" href="https://lewisu.libguides.com/genaifacultystaff" target="_blank" rel="noopener noreferrer"><span class="fab-item__icon"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-robot"/></svg></span> Gen AI Guide</a>
  </div>
  <button class="fab-toggle" id="fabToggle" type="button" aria-label="Help and support menu" aria-expanded="false">
    <span class="fab-toggle__icon" aria-hidden="true">✦</span>
  </button>
</div>

<!-- ══ Ask Us chat modal ══ -->
<div class="chat-overlay" id="chatModal" aria-hidden="true">
  <div class="chat-modal" role="dialog" aria-modal="true" aria-labelledby="chatModalTitle">
    <div class="chat-modal__head">
      <div>
        <div class="chat-modal__title" id="chatModalTitle"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-chat"/></svg> Ask Us</div>
        <div class="chat-modal__sub">Live Lewis University Library chat inside the page</div>
      </div>
      <div class="chat-modal__head-actions">
        <a class="chat-modal__link" href="https://lewisu.libanswers.com/chat/widget/9834cecf0f3b65300e275b111a06f48909feee517a3cfe2daedf5b9229fe58cc" target="_blank" rel="noopener noreferrer">Open separately ↗</a>
        <button class="chat-modal__close" id="chatModalClose" type="button" aria-label="Close chat">✕</button>
      </div>
    </div>
    <div class="chat-modal__body">
      <iframe class="chat-modal__frame" id="chatFrame" title="Lewis University Library chat"
        loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
        data-src="https://lewisu.libanswers.com/chat/widget/9834cecf0f3b65300e275b111a06f48909feee517a3cfe2daedf5b9229fe58cc"></iframe>
      <div class="chat-modal__fallback">
        If the live chat does not appear here, use
        <a href="https://lewisu.libanswers.com/chat/widget/9834cecf0f3b65300e275b111a06f48909feee517a3cfe2daedf5b9229fe58cc" target="_blank" rel="noopener noreferrer">the separate chat window</a>.
      </div>
    </div>
  </div>
</div>
