# The site moved to https://lewis-u-lib.github.io/Quidsima/ (repository Lewis-U-Lib/Quidsima).
# This repository now publishes only the pages in redirect/, which send each old address to its new one.
# The source in src/, data/, and tools/ is kept as it was at the move, for the record; it is no longer built here.
name: Publish redirects to the new address

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check that every old address maps to its new one
        run: node tests/redirect.test.js
      - name: Upload the redirect pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
