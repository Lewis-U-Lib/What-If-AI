# Build, test, and (on main) deploy to GitHub Pages.
# One-time setting, done by a repository admin: Settings → Pages → Source: "GitHub Actions".
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The browser suites are independent of one another, so they run side by side.
  checks:
    name: Checks (${{ matrix.suite }})
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest now uses 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - saved
          - matching
          - pages
          - accessibility
          - contrast
          # the low-vision checks, one job for each palette and view
          - lowvision-crimson
          - lowvision-crimson-plain
          - lowvision-blue
          - lowvision-blue-plain
          - lowvision-light
          - lowvision-light-plain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check the data release
        run: python3 tools/check_release.py
      - name: Check public collection, citations, and license safeguards
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build
        run: python3 tools/build.py

      - name: Install test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install Firefox for the cross-browser restore check
        if: matrix.suite == 'saved'
        run: npx playwright install --with-deps firefox

      - name: Saved use-case ideas (compare, printouts, moving a list, exports) and trial plans
        if: matrix.suite == 'saved'
        run: npm run test:saved
      - name: Palettes and the plain reading view
        if: matrix.suite == 'saved'
        run: npm run test:theme
      - name: Fixes from the October 2026 audit (field fit, route note, Ask Us focus, print, history)
        if: matrix.suite == 'saved'
        run: npm run test:review
      - name: Site checks (fingerprints, CSP, loading states, determinism)
        if: matrix.suite == 'saved'
        run: node tests/site.test.js
      - name: Tool license and all included-material rights
        if: matrix.suite == 'saved'
        run: npm run test:licensing
      - name: Source links and download notices
        if: matrix.suite == 'saved'
        run: npm run test:source-links

      - name: Matching rules, recovery, ranking and broken links
        if: matrix.suite == 'matching'
        run: npm run test:matching

      - name: Page behavior
        if: matrix.suite == 'pages'
        run: npm run test:pages
      - name: AI-system type dialogs
        if: matrix.suite == 'pages'
        env:
          TYPE_SCREENSHOTS: test-results/type-illustrations
        run: node tests/types.test.js
      - name: Save type-dialog screenshots
        if: always() && matrix.suite == 'pages'
        uses: actions/upload-artifact@v4
        with:
          name: type-dialog-screenshots
          path: test-results/type-illustrations
          if-no-files-found: ignore
      - name: Activity feedback
        if: matrix.suite == 'pages'
        run: node tests/feedback.test.js

      - name: Accessibility (axe, WCAG 2.2 A/AA)
        if: matrix.suite == 'accessibility'
        run: node tests/a11y.test.js
      - name: Accessibility in the light palette
        if: matrix.suite == 'accessibility'
        env:
          SITE_THEME: light
        run: node tests/a11y.test.js
      - name: Contrast over textured surfaces
        if: matrix.suite == 'contrast'
        run: node tests/contrast.test.js
      - name: Contrast over textured surfaces in the light palette
        if: matrix.suite == 'contrast'
        env:
          SITE_THEME: light
        run: node tests/contrast.test.js

      # Text contrast, non-text contrast and keyboard focus, color-vision simulation, zoom and text spacing
      # (tests/lowvision.js), in the palette and view this job is named for.
      - name: Low-vision checks
        if: startsWith(matrix.suite, 'lowvision-')
        env:
          LOWVISION_OUT: test-results/lowvision
          SUITE: ${{ matrix.suite }}
        run: VIEWS="${SUITE#lowvision-}" node tests/lowvision.js
      - name: Print the low-vision findings
        if: failure() && startsWith(matrix.suite, 'lowvision-')
        run: grep -h "^FAIL" test-results/lowvision/*.log || true
      - name: Save the low-vision measurements
        if: always() && startsWith(matrix.suite, 'lowvision-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-measurements
          path: test-results/lowvision
          if-no-files-found: ignore

      - name: Upload the site
        if: matrix.suite == 'saved' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The "build" check stays as the gate over every suite: a failed or cancelled
  # suite fails this check, so nothing is published unless all of them pass.
  build:
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test suite to pass
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success

  deploy:
    # only a push to main publishes; pull requests stop after the tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
